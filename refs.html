<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SREE 2026 References · Graham Chickering</title>
  <link rel="stylesheet" href="styles.css?v=5">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <style>
    /* Mobile browsers render iframed PDFs poorly (iOS Safari shows page 1
       only; Android Chrome often shows nothing), so small screens get a
       direct link instead of the embed. */
    .pdf-card { display: none; }

    @media (max-width: 820px) {
      .pdf-frame { display: none; }
      .pdf-card {
        display: block;
        flex: 1;
        min-width: 0;
        padding: 34px 18px 48px;
        background: var(--surface-2);
      }
      .pdf-card .inner {
        box-sizing: border-box;
        width: 100%;
        max-width: 26rem;
        margin: 0 auto;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 26px 20px 24px;
        text-align: center;
      }
      /* The shared bar sets h1 min-width:200px, which overflows narrow phones. */
      .viewer-bar { padding: 12px 16px; gap: 12px; }
      .viewer-bar h1 { min-width: 0; font-size: 1rem; }
      .pdf-card h2 {
        font-family: var(--serif);
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--text);
        margin: 0 0 8px;
      }
      .pdf-card p {
        color: var(--text-muted);
        font-size: .95rem;
        line-height: 1.55;
        margin: 0 0 20px;
      }
      .pdf-card .open {
        display: block;
        background: var(--accent);
        color: #fbf8f1;
        font-weight: 600;
        padding: 14px 18px;
        border-radius: var(--radius);
        text-decoration: none;
      }
      .pdf-card .open:hover { filter: brightness(1.12); text-decoration: none; }
      .pdf-card .secondary {
        display: inline-block;
        margin-top: 16px;
        color: var(--text-muted);
        font-size: .9rem;
      }
      .viewer-bar a.dl.alt { display: none; }
    }
  </style>
</head>
<body class="viewer">
  <div class="viewer-bar">
    <a class="back" href="index.html">&larr; Back</a>
    <h1>Literature Cited &middot; SREE 2026 Poster</h1>
    <a class="dl alt" href="sree.html">View poster</a>
    <a class="dl" href="assets/sree-2026-references.pdf" download>Download PDF</a>
  </div>

  <iframe class="pdf-frame" src="assets/sree-2026-references.pdf#view=FitH" title="Literature Cited — Designing and Evaluating an AI-Assisted Deductive Analysis Workflow, SREE 2026"></iframe>

  <div class="pdf-card">
    <div class="inner">
      <h2>Literature Cited</h2>
      <p>The 27 references behind the SREE 2026 poster
        <em>Designing and Evaluating an AI-Assisted Deductive Analysis Workflow</em>,
        formatted in APA 7.</p>
      <a class="open" href="assets/sree-2026-references.pdf">Open the reference list</a>
      <a class="secondary" href="sree.html">View the poster instead &rarr;</a>
    </div>
  </div>

  <noscript class="pdf-fallback">
    Your browser can't display the embedded PDF. <a href="assets/sree-2026-references.pdf">Open it directly.</a>
  </noscript>
</body>
</html>
